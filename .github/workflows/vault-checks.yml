name: Vault checks

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/marketplace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/marketplace/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Verify architecture checks and restricted data boundaries
        run: pnpm check:boundaries
      - name: Lint
        run: pnpm lint
      - name: Format changed feature code
        run: pnpm format:check
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Unit and access-control tests
        run: pnpm test
      - name: Check existing static site
        run: node ../../scripts/check-site.mjs
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Production build and browser workflows
        run: pnpm test:e2e
      - name: Preserve synthetic-data verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-browser-evidence
          path: apps/marketplace/test-results/
          if-no-files-found: ignore
          retention-days: 7
